<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} · {{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="mark" aria-hidden="true"></span>AI Compiler</a>
    <nav aria-label="Site">
      <a href="{{ '/' | relative_url }}">Overview</a>
      <a href="{{ '/design.html' | relative_url }}" aria-current="page">How it works</a>
      <a href="https://github.com/{{ site.repository }}">GitHub</a>
    </nav>
  </div>
</header>
<main class="doc">
{{ content }}
</main>
<footer>
  <div class="wrap">
    <span>AI Compiler</span>
    <a href="https://github.com/{{ site.repository }}">Source on GitHub</a>
    <a href="https://github.com/{{ site.repository }}/blob/main/docs/design.md">Edit this page</a>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
  // Kramdown renders ```mermaid blocks as highlighted code. Turn them back
  // into diagrams, in colours that match the page.
  (function () {
    if (!window.mermaid) return;
    var blocks = document.querySelectorAll('div.language-mermaid, pre > code.language-mermaid');
    blocks.forEach(function (node) {
      var host = node.tagName === 'CODE' ? node.parentElement : node;
      var pre = document.createElement('pre');
      pre.className = 'mermaid';
      pre.textContent = node.textContent;
      host.replaceWith(pre);
    });
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    window.mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'neutral', securityLevel: 'strict', fontFamily: 'system-ui, sans-serif' });
    window.mermaid.run({ querySelector: 'pre.mermaid' });
  })();
</script>
</body>
</html>
